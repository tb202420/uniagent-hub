; UniAgent Hub · ESP32-S3 温室灌溉节点（真机轨，与模拟器契约对齐）
; 构建/烧录/监视（项目根目录）：
;   pio run -d docs/hardware/firmware/esp32                 # 编译
;   pio run -d docs/hardware/firmware/esp32 -t upload       # 烧录（先填 src/main.cpp 的 WiFi）
;   pio device monitor -d docs/hardware/firmware/esp32      # 串口监视（115200）

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
