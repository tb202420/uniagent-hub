[package]
name = "uniagent-hub-desktop"
version = "0.1.0"
edition = "2021"
description = "UniAgent Hub 桌面外壳（加载本地 Dashboard；Hub 以 sidecar 或外部进程运行）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
