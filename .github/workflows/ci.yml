name: CI

on:
  push:
    branches: [main]
  pull_request:

# 统一 UTF-8：Windows runner 默认 locale 为 cp1252，Python 子进程打印中文会崩溃
env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --junitxml=pytest-results.xml
      - name: Annotate test failures
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest-results.xml)) { exit 0 }
          [xml]$doc = Get-Content pytest-results.xml
          foreach ($tc in $doc.DocumentElement.SelectNodes("//testcase")) {
            $f = $tc.SelectSingleNode("failure")
            if ($f) {
              $msg = ($f.GetAttribute("message") -replace "\s+", " ")
              if ($msg.Length -gt 250) { $msg = $msg.Substring(0, 250) }
              Write-Output ("::error file=" + $tc.GetAttribute("file") + "::FAILED " + $tc.GetAttribute("classname") + "::" + $msg)
            }
          }
